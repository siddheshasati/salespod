[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "salespod"
version = "0.1.0"
description = "A production-oriented autonomous sales pod vertical slice"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.13,<2",
  "Faker>=25,<40",
  "fastapi>=0.115,<1",
  "fastmcp>=2,<3",
  "pydantic>=2.7,<3",
  "SQLAlchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
agents = [
  "langgraph>=0.2,<1",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
salespod-agent = "scripts.run_agent:main"
salespod-api = "scripts.run_api:main"
salespod-mcp = "salespod.interfaces.mcp.server:main"
salespod-signals-mcp = "salespod.interfaces.mcp.signals_server:main"
salespod-seed = "scripts.seed_database:main"
salespod-migrate = "scripts.migrate_database:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["salespod*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "ollama: requires a running local Ollama service and configured models",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
